name: Pages

# 线上预览站：site/ 里的主页（手写 HTML）+ site/demo/ 里的只读演示站（web/ 静态导出）。
# 推 main 就重建；也可以在 Actions 里手动跑一次。站点绑在 pdf2md.1012.wiki（site/CNAME）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # postinstall 会拷 pdf.js 的 worker / CMap，并在 obsidian/ 里装插件依赖（网页直接引用插件源码）
      - name: 安装网页与插件依赖
        working-directory: web
        run: npm ci

      # 造演示书 → next build 静态导出 → 拷进 site/demo/
      - name: 构建演示站
        working-directory: web
        run: npm run demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
